<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <defs>
    <!-- Background subtle glow -->
    <radialGradient id="logo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Primary left ribbon: Cyan to Electric Blue -->
    <linearGradient id="grad-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Diagonal cross ribbon: Electric Blue to Indigo/Violet -->
    <linearGradient id="grad-diag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Right ribbon: Indigo to Purple -->
    <linearGradient id="grad-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Corner highlight -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="20" cy="20" r="18" fill="url(#logo-glow)"/>

  <!-- Squircle Base Frame -->
  <rect x="2" y="2" width="36" height="36" rx="10" fill="#0f172a" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2"/>

  <!-- Dynamic Geometric "N" Nexus Icon -->
  <g filter="url(#soft-shadow)">
    <!-- Left vertical stem with rounded bevels -->
    <path d="M10 11.5C10 10.12 11.12 9 12.5 9H13.2C14.3 9 15.2 9.9 15.2 11V29C15.2 30.1 14.3 31 13.2 31H12.5C11.12 31 10 29.88 10 28.5V11.5Z" 
          fill="url(#grad-left)"/>
    
    <!-- Right vertical stem with rounded bevels -->
    <path d="M24.8 11C24.8 9.9 25.7 9 26.8 9H27.5C28.88 9 30 10.12 30 11.5V28.5C30 29.88 28.88 31 27.5 31H26.8C25.7 31 24.8 30.1 24.8 29V11Z" 
          fill="url(#grad-right)"/>

    <!-- Interlocking dynamic diagonal nexus blade -->
    <path d="M12.8 9.8C13.8 8.8 15.5 9.1 16.1 10.3L25.8 27.2C26.5 28.5 25.6 30.2 24.1 30.2H23.2C22.2 30.2 21.3 29.6 20.8 28.7L11.5 12.4C10.8 11.2 11.6 9.6 12.8 9.8Z" 
          fill="url(#grad-diag)"/>

    <!-- Light reflection overlay on diagonal -->
    <path d="M14.5 10.5L24.5 28C25 28.8 24.5 29.8 23.5 29.8L22.8 29.8L13.5 13C13 12.1 13.6 11 14.5 10.5Z" 
          fill="url(#highlight)"/>
  </g>

  <!-- Glowing central node representing team synergy -->
  <circle cx="19.5" cy="19.5" r="2.2" fill="#38bdf8"/>
  <circle cx="19.5" cy="19.5" r="1" fill="#ffffff"/>
</svg>
